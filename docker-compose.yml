services:
  postgres:
    image: postgres:17-alpine
    container_name: solidity-quiz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: solidity_quiz
    ports:
      - '5432:5432'
    volumes:
      - solidity-quiz-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quiz -d solidity_quiz']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: solidity-quiz-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - solidity-quiz-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  solidity-quiz-data:
  solidity-quiz-redis:
